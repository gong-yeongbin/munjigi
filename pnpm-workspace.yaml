packages:
  - "apps/*"
  - "packages/*"

# pnpm 10은 의존성의 lifecycle script를 기본 차단한다. 네이티브 바이너리를 내려받는
# 패키지만 여기에 명시해 허용한다 — 빠지면 SWC 바이너리가 없어 Vitest가 기동하지 않는다.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  # prisma migrate deploy가 쓰는 schema engine 바이너리. 허용하지 않으면 CLI가 첫 실행 때 내려받는데,
  # ECS의 마이그레이션 태스크(Dockerfile migrate 단계)에서 매번 받게 되므로 install 때 받아 이미지에 넣는다.
  - "@prisma/engines"
