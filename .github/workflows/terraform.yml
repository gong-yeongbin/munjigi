# infra/frontend·infra/backend의 Terraform. PR이면 plan을 스택별 댓글로, main이면 apply.
# AWS 키 없이 OIDC로 bootstrap이 만든 B 역할(TERRAFORM_ROLE_ARN)을 assume한다. backend 스택은 그 역할이 다시 A 계정 역할을 assume한다(providers.tf).
# 포크 PR은 OIDC 토큰이 없어 돌지 않는다. 경로가 infra/** 라 한 스택만 바꿔도 다른 스택 plan(no-op)이 같이 돈다
name: terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [frontend, backend]
    # 스택마다 apply가 겹치지 않게 한 번에 하나만. 스택끼리는 state가 달라 같이 돌아도 된다
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      # backend만 쓴다. 선언되지 않은 변수의 TF_VAR_는 Terraform이 무시해 frontend에는 영향 없다
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - run: terraform fmt -check -recursive
        working-directory: infra

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"

      - run: terraform validate

      - name: plan
        id: plan
        if: github.event_name == 'pull_request'
        # tee 때문에 terraform의 종료 코드가 가려지지 않게 pipefail이 켜진 bash를 쓴다
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: plan 댓글
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const raw = fs.readFileSync(`infra/${stack}/plan.txt`, 'utf8');
            const plan = raw.length > 60000 ? raw.slice(0, 60000) + '\n…(잘림)' : raw;
            const prefix = `### terraform plan (infra/${stack})`;
            const body = `${prefix} — ${process.env.PLAN_OUTCOME}\n\n<details><summary>보기</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(prefix));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: plan 실패면 중단
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve

      - name: outputs
        if: github.event_name != 'pull_request'
        run: terraform output
