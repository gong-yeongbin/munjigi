# 프론트 빌드 → S3 동기화 → CloudFront 무효화. main의 production 환경에서만, 배포 역할(DEPLOY_ROLE_ARN)로.
# main에 직접 push해도 배포된다. 대신 같은 커밋의 ci(check)가 통과할 때까지 기다리고, 실패면 배포하지 않는다.
# 필요한 저장소 variables: DEPLOY_ROLE_ARN, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID (infra/frontend의 terraform output)
name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://munjigi.dev
    steps:
      - uses: actions/checkout@v4

      # 같은 커밋의 ci(job 이름 check)가 끝나길 기다린다. 성공이면 계속, 실패·취소면 배포하지 않는다. 아직 안 떴으면(null) 계속 기다린다
      - name: ci 통과 대기
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 80); do
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check" --jq '.check_runs[0] | "\(.status) \(.conclusion)"')
            case "$STATUS" in
              "completed success") echo "ci 통과"; exit 0 ;;
              completed*) echo "ci 결과가 success가 아니다: $STATUS"; exit 1 ;;
              *) echo "ci 대기 중: $STATUS"; sleep 15 ;;
            esac
          done
          echo "ci 대기 시간 초과(20분)"; exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 공개 범위(SCOPE)는 코드 상수다. 구글 클라이언트 ID(공개 값)만 변수에서 넣는다. 백엔드 GOOGLE_CLIENT_ID와 같은 값
      - run: pnpm --filter frontend build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 assets는 1년 immutable, index.html은 매번 새로 받게 no-cache. 지운 파일은 버킷에서도 지운다
      - name: upload assets
        run: >
          aws s3 sync apps/frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}"
          --delete --exclude index.html
          --cache-control "public, max-age=31536000, immutable"

      - name: upload index.html
        run: >
          aws s3 cp apps/frontend/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html"
          --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: invalidate
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/" "/index.html"
